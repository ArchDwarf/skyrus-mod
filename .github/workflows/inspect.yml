name: inspect
on: { push: { branches: [inspect] } }
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava --no-daemon || true
      - name: inspect
        run: |
          set +e
          J=~/.gradle/caches/fabric-loom/26.2/minecraft-client.jar
          C=$(find ~/.gradle -name 'fabric-command-api-v2*.jar' | grep -v sources | head -1)
          echo "=== Hud ==="; javap -cp $J net.minecraft.client.gui.Hud | grep -iE 'chat|title|overlay|Hud\('
          echo "=== Gui ==="; javap -p -cp $J net.minecraft.client.gui.Gui | grep -iE 'hud|chat|Gui\('
          echo "=== ChatComponent ==="; javap -cp $J net.minecraft.client.gui.components.ChatComponent | grep -iE 'addMessage|addClientSystem'
          echo "=== ClientCommands ==="; javap -cp $C net.fabricmc.fabric.api.client.command.v2.ClientCommands
          echo "=== Source ==="; javap -cp $C net.fabricmc.fabric.api.client.command.v2.FabricClientCommandSource | grep -iE 'feedback|client|Minecraft'
          echo "=== Callback ==="; javap -cp $C 'net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback'
          echo "=== GameProfile ==="; G=$(find ~/.gradle -name 'authlib*.jar' | grep -v sources | head -1); javap -cp $G com.mojang.authlib.GameProfile | grep -iE 'name'
          echo "=== Minecraft getCurrentServer ==="; javap -cp $J net.minecraft.client.Minecraft | grep -iE 'getCurrentServer|getConnection'
